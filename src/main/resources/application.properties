spring.application.name=ontheway
spring.profiles.active=local
spring.jackson.time-zone=Asia/Seoul
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
jwt.access-token-validity=3600000
jwt.refresh-token-validity=1209600000

r2.access-key=${R2_ACCESS_KEY}
r2.secret-key=${R2_SECRET_KEY}
r2.endpoint=${R2_ENDPOINT}
r2.bucket-name=ontheway2026-images
r2.public-url=${R2_PUBLIC_URL}

# 사진 한 장의 용량 상한. 10MB는 임의의 값
spring.servlet.multipart.max-file-size=10MB
# 요청 전체 한도. 사진 한 장에 JSON 파트가 들어갈 여유(2MB)를 더한 값이며, 임의의 값
spring.servlet.multipart.max-request-size=12MB

# 배송대기중 -> 배송중 자동 전이를 확인하는 주기. 매 분 0초. 임의의 값
scheduler.order.advance-delivering-cron=0 * * * * *
# 확인요청 -> 배송완료 자동 전이를 확인하는 시각. 매일 자정 10분 뒤. 임의의 값
scheduler.order.auto-complete-cron=0 10 0 * * *
# 확인요청 후 응답이 없으면 자동 완료로 넘기기까지 기다리는 시간(시간 단위)
scheduler.order.completion-auto-confirm-hours=72